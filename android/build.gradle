group = "com.beauty.beauty_camera_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.beauty.camera_plugin"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")

        // CameraX core dependencies
        def camerax_version = "1.5.0"
        implementation "androidx.camera:camera-core:${camerax_version}"
        implementation "androidx.camera:camera-camera2:${camerax_version}"
        implementation "androidx.camera:camera-lifecycle:${camerax_version}"
        implementation "androidx.camera:camera-video:${camerax_version}"
        implementation "androidx.camera:camera-view:${camerax_version}"
        
        // CameraX Extensions
        implementation "androidx.camera:camera-extensions:${camerax_version}"
        
        // Important: SurfaceProcessor for effects support
        implementation "androidx.camera:camera-effects:${camerax_version}"
        
        // Media Pipe for face detection (optional)
        implementation 'com.google.mediapipe:tasks-vision:0.10.9'

        // OpenGL ES for custom shaders - sử dụng OpenGL ES trực tiếp thay vì dùng thư viện Rajawali
        implementation 'androidx.core:core-ktx:1.11.0'
       
        // Support libraries
        implementation "androidx.lifecycle:lifecycle-common-java8:2.8.7"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
        implementation "com.google.guava:guava:33.4.0-android"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
